services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adk_user
      POSTGRES_PASSWORD: adk_password
      POSTGRES_DB: adk_sessions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adk_user -d adk_sessions"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
